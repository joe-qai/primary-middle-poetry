<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>墨韵 · 中小学古诗词全集</title>
<meta name="description" content="K12 必背古诗词、文言文、散文、故事与课外篇，含拼音、译文、赏析与考点。">
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #20201d;
    --ink-2: #46443e;
    --ink-3: #6f6b62;
    --ink-4: #9a958a;
    --paper: #f6f1e7;
    --paper-2: #efe7d6;
    --card: #fffdf8;
    --line: rgba(60, 45, 20, 0.10);
    --line-strong: rgba(60, 45, 20, 0.18);
    --accent: #a8342a;
    --accent-2: #c4594d;
    --accent-bg: rgba(168, 52, 42, 0.07);
    --jade: #2f6f5e;
    --jade-bg: rgba(47, 111, 94, 0.09);
    --gold: #b5852b;
    --gold-bg: rgba(181, 133, 43, 0.12);
    --radius: 6px;
    --radius-lg: 14px;
    --shadow-1: 0 1px 2px rgba(60,45,20,0.05), 0 2px 10px rgba(60,45,20,0.05);
    --shadow-2: 0 2px 6px rgba(60,45,20,0.07), 0 12px 32px rgba(60,45,20,0.09);
    --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
    --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--accent-2) transparent; }
  body {
    font-family: var(--serif);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(181,133,43,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(168,52,42,0.04), transparent 45%);
    pointer-events: none; z-index: 0;
  }
  ::selection { background: rgba(168,52,42,0.16); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(168,52,42,0.35); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(168,52,42,0.55); }

  /* ============ HERO ============ */
  .hero {
    position: relative; z-index: 1;
    padding: clamp(3rem, 8vw, 5.5rem) 1.5rem clamp(2rem, 5vw, 3.5rem);
    text-align: center;
    background: linear-gradient(178deg, var(--paper-2) 0%, rgba(239,231,214,0.35) 55%, transparent 100%);
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; left: 50%; top: 8%;
    width: min(760px, 130%); aspect-ratio: 1;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(181,133,43,0.10), transparent 62%);
    pointer-events: none;
  }
  .seal {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 66px; height: 66px;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 5px;
    font-weight: 900; font-size: 1.05rem; line-height: 1.05;
    letter-spacing: 0.08em;
    transform: rotate(3deg);
    margin-bottom: 1.6rem;
    position: relative; z-index: 1;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px rgba(168,52,42,0.25);
    background: rgba(255,255,255,0.25);
  }
  .hero h1 {
    position: relative; z-index: 1;
    font-size: clamp(2.1rem, 5.5vw, 3.4rem);
    font-weight: 900; letter-spacing: 0.14em;
    margin-bottom: 0.7rem;
  }
  .hero h1 .dot { color: var(--accent); }
  .hero-sub {
    position: relative; z-index: 1;
    font-family: var(--sans); font-weight: 300;
    font-size: clamp(0.82rem, 2.2vw, 0.98rem);
    color: var(--ink-3); letter-spacing: 0.3em;
    margin-bottom: 2.4rem;
  }
  .hero-stats {
    position: relative; z-index: 1;
    display: flex; justify-content: center; gap: clamp(1.4rem, 5vw, 3.6rem);
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat b {
    display: block;
    font-family: var(--sans); font-size: clamp(1.35rem, 4vw, 1.9rem);
    font-weight: 700; color: var(--accent); line-height: 1.1;
  }
  .stat span {
    font-family: var(--sans); font-size: 0.72rem; font-weight: 400;
    color: var(--ink-4); letter-spacing: 0.12em;
  }

  /* ============ NAV ============ */
  .navbar {
    position: sticky; top: 0; z-index: 60;
    background: rgba(246,241,231,0.86);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1080px; margin: 0 auto;
    display: flex; align-items: center; gap: 0.15rem;
    padding: 0 1rem; height: 56px;
    overflow-x: auto; scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex-shrink: 0;
    font-family: var(--sans); font-size: 0.86rem; font-weight: 400;
    padding: 0.42rem 0.95rem; border: none; background: transparent;
    color: var(--ink-2); cursor: pointer; border-radius: 22px;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.04em; white-space: nowrap;
  }
  .nav-btn:hover { background: var(--accent-bg); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(168,52,42,0.28); }
  .nav-btn .n {
    font-size: 0.68rem; opacity: 0.7; margin-left: 3px;
  }
  .nav-spacer { flex: 1; }
  .progress-pill {
    flex-shrink: 0;
    font-family: var(--sans); font-size: 0.72rem;
    color: var(--jade); background: var(--jade-bg);
    padding: 0.3rem 0.7rem; border-radius: 20px; white-space: nowrap;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .progress-pill b { font-weight: 700; }

  /* ============ TOOLBAR ============ */
  .toolbar {
    max-width: 1080px; margin: 0 auto;
    padding: 1.5rem 1.5rem 0.5rem;
    display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center;
  }
  .search {
    position: relative; flex: 1; min-width: 220px;
  }
  .search input {
    width: 100%;
    font-family: var(--sans); font-size: 0.92rem;
    padding: 0.66rem 1rem 0.66rem 2.6rem;
    border: 1.5px solid var(--line-strong); border-radius: 24px;
    background: rgba(255,253,248,0.9); color: var(--ink);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 4px var(--accent-bg); }
  .search input::placeholder { color: var(--ink-4); }
  .search .ico {
    position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%);
    color: var(--ink-4); font-size: 1rem; pointer-events: none;
  }
  .search-sum {
    margin: 1.4rem 0 0; font-family: var(--sans); font-size: 0.84rem;
    color: var(--ink-3); letter-spacing: 0.02em;
  }
  .search-sum b { color: var(--accent); font-weight: 600; }

  /* ============ MAIN / SECTIONS ============ */
  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0.5rem 1.5rem 6rem; }

  .panel { display: none; animation: panelIn 0.35s ease both; }
  .panel.on { display: block; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .sec-head {
    display: flex; align-items: flex-end; gap: 1rem;
    margin: 2.2rem 0 1.3rem; padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--line);
  }
  .sec-head .glyph {
    width: 46px; height: 46px; flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 1.15rem; font-weight: 700;
    background: var(--gold-bg); color: var(--gold);
    border: 1px solid rgba(181,133,43,0.25);
  }
  .sec-head.v .glyph { background: var(--accent-bg); color: var(--accent); border-color: rgba(168,52,42,0.22); }
  .sec-head.j .glyph { background: var(--jade-bg); color: var(--jade); border-color: rgba(47,111,94,0.22); }
  .sec-head.k .glyph { background: rgba(63,63,58,0.08); color: var(--ink); border-color: rgba(63,63,58,0.2); }
  .sec-head h2 { font-size: 1.28rem; font-weight: 700; letter-spacing: 0.1em; line-height: 1.3; }
  .sec-head p { font-family: var(--sans); font-size: 0.76rem; font-weight: 300; color: var(--ink-4); letter-spacing: 0.08em; }
  .sec-head .cnt { margin-left: auto; font-family: var(--sans); font-size: 0.76rem; color: var(--ink-4); }

  /* ============ CARD GRID ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  .swipe-hint {
    display: none;
    font-family: var(--sans);
    font-size: 0.7rem;
    color: var(--ink-4);
    letter-spacing: 0.08em;
    text-align: right;
    padding: 0 0.2rem 0.35rem;
  }

  /* ---- H5：横向顺切卡片，压缩纵向高度 ---- */
  @media (max-width: 720px) {
    .hero { padding: 1.6rem 1.2rem 1.1rem; }
    .seal { width: 46px; height: 46px; font-size: 0.78rem; margin-bottom: 0.7rem; }
    .hero h1 { font-size: 1.7rem; letter-spacing: 0.1em; margin-bottom: 0.35rem; }
    .hero-sub { font-size: 0.68rem; letter-spacing: 0.16em; margin-bottom: 0.9rem; }
    .hero-stats { gap: 1.4rem; }
    .stat b { font-size: 1.15rem; }
    .stat span { font-size: 0.62rem; letter-spacing: 0.04em; }

    .nav-inner { height: 48px; padding: 0 0.7rem; }
    .nav-btn { font-size: 0.8rem; padding: 0.36rem 0.72rem; }

    .toolbar { padding: 0.9rem 1rem 0.2rem; gap: 0.5rem; }
    .search input { padding: 0.55rem 0.9rem 0.55rem 2.3rem; font-size: 0.85rem; }

    main { padding: 0.2rem 1rem 2rem; }
    .sec-head { margin: 1.1rem 0 0.7rem; padding-bottom: 0.55rem; gap: 0.6rem; }
    .sec-head .glyph { width: 34px; height: 34px; font-size: 0.9rem; }
    .sec-head h2 { font-size: 1.02rem; }
    .sec-head p { font-size: 0.66rem; }
    .sec-head .cnt { font-size: 0.68rem; }

    .swipe-hint { display: block; text-align: center; font-size: 0.66rem; padding-bottom: 0.3rem; }

    .grid {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 0.1rem;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      padding: 0.1rem 1.1rem 0.75rem 0.1rem;
      margin: 0;
      scrollbar-width: none;
    }
    .grid::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 80%;
      scroll-snap-align: start;
      padding: 1rem 1.05rem 0.9rem;
    }
    .card:last-child { margin-right: 0.1rem; }
    .card-title { font-size: 1.02rem; }
    .card-excerpt { font-size: 0.9rem; line-height: 1.75; -webkit-line-clamp: 2; margin-bottom: 0.5rem; }
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.3rem 1.1rem;
    cursor: pointer;
    box-shadow: var(--shadow-1);
    transition: transform 0.24s cubic-bezier(.2,.8,.2,1), box-shadow 0.24s, border-color 0.24s;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--gold), var(--accent-2));
    opacity: 0.85; transition: width 0.24s;
  }
  .card.v::before { background: linear-gradient(180deg, var(--accent), var(--accent-2)); }
  .card.j::before { background: linear-gradient(180deg, var(--jade), #4f9a86); }
  .card.k::before { background: linear-gradient(180deg, #3f3f3a, #7a6a4f); }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-2);
    border-color: rgba(168,52,42,0.22);
  }
  .card:hover::before { width: 4px; }
  .card:active { transform: translateY(-1px) scale(0.995); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .card-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.55rem; }
  .card-title { font-size: 1.08rem; font-weight: 700; letter-spacing: 0.06em; }
  .dyn {
    font-family: var(--sans); font-size: 0.68rem;
    color: var(--ink-3); background: var(--paper-2);
    padding: 1px 8px; border-radius: 20px; letter-spacing: 0.05em;
  }
  .grade-badge {
    font-family: var(--sans); font-size: 0.66rem;
    color: var(--gold); background: var(--gold-bg);
    padding: 1px 7px; border-radius: 4px; font-weight: 500;
  }
  .card-author {
    margin-left: auto; font-family: var(--sans);
    font-size: 0.78rem; color: var(--ink-3);
  }
  .card-excerpt {
    font-size: 0.95rem; color: var(--ink-2); line-height: 1.9;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 0.7rem;
  }
  .card-foot { display: flex; align-items: center; gap: 0.45rem; }
  .tag2 {
    font-family: var(--sans); font-size: 0.66rem;
    color: var(--accent); background: var(--accent-bg);
    padding: 1px 7px; border-radius: 4px;
  }
  .done-mark {
    margin-left: auto;
    font-family: var(--sans); font-size: 0.68rem;
    color: var(--jade); display: flex; align-items: center; gap: 0.25rem;
  }
  .done-mark .dotg {
    width: 6px; height: 6px; border-radius: 50%; background: var(--jade);
    box-shadow: 0 0 0 3px var(--jade-bg);
  }
  .card.is-done { border-color: rgba(47,111,94,0.3); }
  .card.is-done::before { background: linear-gradient(180deg, var(--jade), #4f9a86); }

  /* ============ EMPTY ============ */
  .empty {
    display: none; text-align: center; padding: 4rem 1rem;
    font-family: var(--sans); font-weight: 300; color: var(--ink-4);
  }
  .empty.on { display: block; }
  .empty .big { font-size: 2.2rem; opacity: 0.4; margin-bottom: 0.6rem; }

  /* ============ DETAIL MODAL ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(32,32,29,0.42);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 820px;
    min-width: 0;
    max-height: 100dvh;
    background: var(--card);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: -10px 0 60px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    transform: translateY(28px) scale(0.985);
    opacity: 0;
    transition: transform 0.34s cubic-bezier(.2,.85,.25,1), opacity 0.28s;
    overflow: hidden;
  }
  .overlay.on .sheet { transform: none; opacity: 1; }
  @media (min-width: 720px) {
    .overlay { padding: 2.2rem; }
    .sheet { border-radius: var(--radius-lg); max-height: calc(100dvh - 4.4rem); }
  }

  .sheet-head {
    position: relative; flex-shrink: 0;
    padding: 1.5rem 1.7rem 1.1rem;
    background: linear-gradient(180deg, var(--paper-2), var(--card));
    border-bottom: 1px solid var(--line);
  }
  .sheet-head .kicker {
    font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--ink-4); margin-bottom: 0.35rem; display: flex; gap: 0.5rem; align-items: center;
    flex-wrap: wrap;
  }
  .sheet-head h2 { font-size: clamp(1.35rem, 3.6vw, 1.75rem); font-weight: 900; letter-spacing: 0.08em; line-height: 1.3; padding-right: 7.8rem; }
  .sheet-head .by { font-family: var(--sans); font-size: 0.85rem; color: var(--ink-3); margin-top: 0.3rem; }
  .sheet-close {
    position: absolute; top: 1rem; right: 1rem;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: rgba(255,253,248,0.85);
    color: var(--ink-2); font-size: 1.1rem; cursor: pointer;
    display: grid; place-items: center; transition: all 0.18s;
  }
  .sheet-close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* 朗读正文 */
  .sheet-speak {
    position: absolute; top: 1rem; right: 3.6rem;
    height: 36px; padding: 0 0.9rem; border-radius: 18px;
    border: 1px solid var(--line-strong); background: rgba(255,253,248,0.85);
    color: var(--ink-2); font-family: var(--sans); font-size: 0.78rem;
    letter-spacing: 0.06em; cursor: pointer; display: inline-flex;
    align-items: center; gap: 0.3rem; transition: all 0.18s; white-space: nowrap;
  }
  .sheet-speak::before { content: '🔊'; font-size: 0.82rem; line-height: 1; }
  .sheet-speak:hover { border-color: var(--accent-2); color: var(--accent); }
  .sheet-speak.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sheet-speak.on:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  @media (max-width: 520px) {
    .sheet-speak { top: 0.85rem; right: 3.3rem; height: 32px; padding: 0 0.7rem; font-size: 0.72rem; }
    .sheet-close { top: 0.85rem; right: 0.9rem; width: 32px; height: 32px; }
  }
  /* 逐句高亮跟读 */
  .sheet-body .sent { border-radius: 4px; transition: background-color 0.16s, box-shadow 0.16s; }
  .sheet-body .sent.speaking { background: rgba(176, 122, 64, 0.16); box-shadow: 0 0 0 3px rgba(176, 122, 64, 0.16); }
  #sheetTitle.speaking, #sheetBy.speaking { color: var(--accent); }
  .speak-tip {
    position: fixed; left: 50%; bottom: 1.6rem; z-index: 999;
    transform: translate(-50%, 0.8rem); opacity: 0; pointer-events: none;
    max-width: 86vw; padding: 0.6rem 1rem; border-radius: 999px;
    background: rgba(35, 30, 24, 0.92); color: #fff;
    font-family: var(--sans); font-size: 0.8rem; line-height: 1.4; text-align: center;
    transition: opacity 0.22s, transform 0.22s;
  }
  .speak-tip.on { opacity: 1; transform: translate(-50%, 0); }

  .sheet-body {
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    padding: 1.5rem 1.7rem 2rem;
    overscroll-behavior: contain;
  }
  @media (max-width: 520px) { .sheet-head { padding: 1.2rem 1.1rem 0.9rem; } .sheet-body { padding: 1.2rem 1.1rem 1.6rem; } }

  /* poem display */
  .poem-lines { text-align: center; margin: 0.6rem 0 1.6rem; --poem-fs: clamp(1.12rem, 3.1vw, 1.42rem); }
  .poem-lines .ln {
    font-size: calc(var(--poem-fs) * var(--fit, 1));
    line-height: 2.5; letter-spacing: 0.06em; color: var(--ink);
  }
  /* 重点考试诗句：整行加粗，便于复习时一眼锁定 */
  .poem-lines .ln.key-line { font-weight: 700; }
  .poem-lines .ln.key-line .ruby { font-weight: 700; }
  /* 句内小段：窄屏放不下整联时，整段在逗号处换行，不把最后一两个字挤下去 */
  .poem-lines .seg { display: inline-block; white-space: nowrap; vertical-align: baseline; }
  /* 极窄屏/超长小段的兜底：放开 nowrap，允许自然折行，避免横向溢出 */
  .poem-lines.freewrap .seg { white-space: normal; }
  .ruby { ruby-position: over; }
  ruby rt {
    font-family: var(--sans); font-size: 0.58em;
    color: var(--accent); font-weight: 400;
    letter-spacing: 0; line-height: 1;
  }

  .block { margin-bottom: 1.4rem; }
  .block > .label {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: var(--sans); font-size: 0.74rem; font-weight: 500;
    letter-spacing: 0.1em; color: var(--accent);
    margin-bottom: 0.55rem;
  }
  .block > .label::before { content: ''; width: 14px; height: 2px; background: var(--accent-2); border-radius: 2px; }
  .block.j > .label { color: var(--jade); }
  .block.j > .label::before { background: var(--jade); }
  .block p { font-size: 0.96rem; color: var(--ink-2); line-height: 1.95; text-align: justify; overflow-wrap: anywhere; word-break: break-word; }
  .block p + p { margin-top: 0.5rem; }

  .points { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .points li {
    position: relative; padding-left: 1.5rem;
    font-size: 0.92rem; color: var(--ink-2); line-height: 1.7;
  }
  .points li::before {
    content: '考'; position: absolute; left: 0; top: 0.18em;
    font-family: var(--sans); font-size: 0.6rem; font-weight: 700;
    color: var(--gold); background: var(--gold-bg);
    width: 1.15rem; height: 1.15rem; border-radius: 3px;
    display: grid; place-items: center;
  }

  .sheet-foot {
    flex-shrink: 0; padding: 0.8rem 1.7rem;
    border-top: 1px solid var(--line);
    display: flex; gap: 0.6rem; align-items: center;
    background: var(--card);
  }
  .btn {
    font-family: var(--sans); font-size: 0.84rem; font-weight: 500;
    padding: 0.6rem 1.2rem; border-radius: 22px; border: 1.5px solid var(--line-strong);
    background: transparent; color: var(--ink-2); cursor: pointer;
    transition: all 0.18s; letter-spacing: 0.03em; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-2); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.done-btn.done { background: var(--jade); border-color: var(--jade); color: #fff; }
  .btn.grow { flex: 1; }
  .nav-arrows { display: flex; gap: 0.5rem; }
  .nav-arrows .btn { padding: 0.6rem 0.8rem; }
  @media (max-width: 380px) { .nav-arrows .txt { display: none; } }

  /* ============ PROGRESS PANEL ============ */
  .prog-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  @media (max-width: 680px) { .prog-wrap { grid-template-columns: 1fr; } }
  .prog-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 1.4rem 1.5rem; box-shadow: var(--shadow-1);
  }
  .prog-card h3 { font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
  .prog-card .sub { font-family: var(--sans); font-size: 0.74rem; color: var(--ink-4); margin-bottom: 1rem; }
  .ring-wrap { display: flex; align-items: center; gap: 1.2rem; }
  .ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--sans); font-size: 1.15rem; font-weight: 700; color: var(--ink);
  }
  .ring .val small { font-size: 0.62rem; color: var(--ink-4); font-weight: 400; }
  .ring-legend { font-family: var(--sans); font-size: 0.8rem; color: var(--ink-3); line-height: 1.9; }
  .ring-legend b { color: var(--ink); }
  .prog-actions { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

  /* ============ STORY / PROSE READER ============ */
  .reader-title { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
  .reader-meta { font-family: var(--sans); font-size: 0.76rem; color: var(--ink-4); margin-bottom: 1.1rem; }
  .reader-body p { font-size: 1rem; line-height: 2.05; color: var(--ink-2); text-align: justify; margin-bottom: 0.8rem; text-indent: 2em; }
  .reader-body p.noindent { text-indent: 0; }
  /* 文言文重点句：句内加粗，不影响整段阅读 */
  .reader-body .key-line { font-weight: 700; color: var(--ink); }

  /* ============ FOOTER ============ */
  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 2.2rem 1.5rem calc(2.2rem + env(safe-area-inset-bottom));
    font-family: var(--sans); font-size: 0.76rem; color: var(--ink-4);
    letter-spacing: 0.1em; border-top: 1px solid var(--line);
  }
  footer .sep { margin: 0 0.5rem; opacity: 0.5; }

  /* back to top */
  .to-top {
    position: fixed; right: 1.1rem; bottom: 1.1rem; z-index: 90;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 1.15rem; cursor: pointer;
    box-shadow: 0 4px 18px rgba(168,52,42,0.4);
    opacity: 0; pointer-events: none; transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s;
    display: grid; place-items: center;
  }
  .to-top.on { opacity: 1; pointer-events: auto; transform: none; }
  .to-top:active { transform: scale(0.94); }

  /* skeleton shimmer for loading */
  .skel { background: linear-gradient(100deg, var(--paper-2) 30%, #faf6ec 50%, var(--paper-2) 70%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 6px; }
  @keyframes sk { to { background-position: -200% 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  /* ============================================================
     H5 字号：小屏默认偏小，整体上调一档（放在最后以保证覆盖）
     ============================================================ */
  @media (max-width: 720px) {
    html { font-size: 17.5px; }

    .hero h1 { font-size: 1.78rem; }
    .hero-sub { font-size: 0.72rem; letter-spacing: 0.12em; }
    .stat b { font-size: 1.2rem; }
    .stat span { font-size: 0.72rem; }

    .nav-btn { font-size: 0.86rem; }
    .search input { font-size: 0.94rem; }
    .search-sum { font-size: 0.86rem; }

    .sec-head h2 { font-size: 1.08rem; }
    .sec-head p { font-size: 0.74rem; }
    .sec-head .cnt { font-size: 0.74rem; }
    .swipe-hint { font-size: 0.72rem; }

    .card-title { font-size: 1.1rem; }
    .card-excerpt { font-size: 0.98rem; line-height: 1.8; }
    .card-author { font-size: 0.82rem; }
    .dyn, .grade-badge, .tag2, .done-mark { font-size: 0.74rem; }
    .empty { font-size: 0.86rem; }

    /* 详情页 */
    .sheet-foot { padding: 0.7rem 0.85rem; gap: 0.5rem; }
    .sheet-foot .btn { padding: 0.58rem 0.9rem; }
    .sheet-body { font-size: 1.02rem; }
    .block p { font-size: 1.02rem; }
    .block > .label { font-size: 0.82rem; }
    .poem-lines { --poem-fs: clamp(1.26rem, 5.4vw, 1.55rem); }
    .sheet-speak { font-size: 0.8rem; }
    .sheet-by, .sheet-kicker { font-size: 0.78rem; }

    /* 进度页 */

    .prog-card .sub { font-size: 0.8rem; }
  }

  /* 诗人组合 */
  .group-card {
    background: var(--paper);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s;
    border: 1px solid transparent;
  }
  .group-card:hover, .group-card:focus-visible {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-color: var(--jade);
  }
  .group-name { font-size: 1.15rem; font-weight: 700; color: var(--ink); margin-bottom: 0.2rem; }
  .group-meta { font-size: 0.78rem; color: var(--ink-3); margin-bottom: 0.35rem; }
  .group-members { font-size: 0.92rem; color: var(--ink-2); margin-bottom: 0.3rem; }
  .group-desc { font-size: 0.82rem; color: var(--ink-4); line-height: 1.5; }
  .group-intro {
    background: var(--ink-4);
    color: var(--paper);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin: 0.75rem 0 1rem;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .member-sections { display: flex; flex-direction: column; gap: 1.5rem; }
  .member-block h3 { font-size: 1rem; color: var(--ink-2); margin: 0 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px dashed var(--line); }
  .btn-back { background: none; border: 1px solid var(--ink-3); color: var(--ink-2); border-radius: 8px; padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.88rem; margin-bottom: 0.75rem; }
  .btn-back:hover { background: var(--ink-4); color: var(--paper); }

</style>
</head>

<script src="data.js"></script>
<script>
/* ============================================================
   墨韵 · 应用逻辑
   ============================================================ */
(function () {
  'use strict';

  const STORE_KEY = 'moyun_progress_v2';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  // ---- data normalization ----
  const D = window.POETRY_DATA || { poems: [], prose: [], stories: [], extras: [], classics: [] };

  // 按年级排序（新补篇目可能追加在数组末尾，这里统一归位）
  const GRADE_ORDER = [
    '一年级上', '一年级下', '二年级上', '二年级下',
    '三年级上', '三年级下', '四年级上', '四年级下',
    '五年级上', '五年级下', '六年级上', '六年级下',
    '七年级上', '七年级下', '八年级上', '八年级下',
    '九年级上', '九年级下'
  ];
  const gradeRank = g => { const i = GRADE_ORDER.indexOf(g); return i < 0 ? 999 : i; };

  const allItems = []
    .concat((D.poems || []).map(x => ({ ...x, _kind: 'poem' })).sort((a, b) => gradeRank(a.grade) - gradeRank(b.grade)))
    .concat((D.prose || []).map(x => ({ ...x, _kind: 'prose' })).sort((a, b) => gradeRank(a.grade) - gradeRank(b.grade)))
    .concat((D.stories || []).map(x => ({ ...x, _kind: 'story' })))
    .concat((D.extras || []).map(x => ({ ...x, _kind: 'extra' })))
    .concat((D.classics || []).map(x => ({ ...x, _kind: 'classics' })));

  const byId = Object.fromEntries(allItems.map(x => [x.id, x]));

  // 重点考试诗句（data.js 中的 window.POETRY_KEY_LINES）
  const KEY_LINES = window.POETRY_KEY_LINES || {};
  function stripAnn(s) { return String(s || '').replace(/\{([^}]*)\}/g, '').replace(/\s+/g, ''); }
  function isKeyLine(item, line) {
    const keys = KEY_LINES[item.id];
    if (!keys || !keys.length) return false;
    const plainLine = stripAnn(line);
    return keys.some(k => plainLine.includes(stripAnn(k)));
  }

  // ---- progress store ----
  let done = new Set();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) done = new Set(JSON.parse(raw)); } catch (e) {}
  function saveDone() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...done])); } catch (e) {} }

  // ---- ruby pinyin parser ----
  // markup: 字{pīn} — text outside braces is plain; {p} attaches to preceding char
  function rubyHTML(text) {
    if (!text) return '';
    // Split into lines by \n
    const lines = String(text).split('\n');
    return lines.map(line => {
      let out = '';
      const re = /([\s\S]?)\{([^}]*)\}/g;
      let last = 0, m;
      while ((m = re.exec(line)) !== null) {
        out += esc(line.slice(last, m.index));
        const ch = m[1] || '';
        const py = m[2];
        if (py) out += `<ruby class="ruby">${esc(ch)}<rt>${esc(py)}</rt></ruby>`;
        else out += esc(ch);
        last = m.index + m[0].length;
      }
      out += esc(line.slice(last));
      return out;
    }).join('\n');
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
   // 把一句按逗号切成小段：窄屏放不下整联时整段换行，避免最后几个字单独掉行
   // 额外：七言/五言无逗号句按二/二/三、二/三节奏插语义断点，使折行发生在正确位置
   function segWrap(html) {
     const raw = String(html || '');
     // 先找纯汉字序列（不含任何标点），有标点的走原有逻辑；无标点的按节奏切
     const hasPunct = /[，；、：！？!?\n]/.test(raw);
     if (!hasPunct) {
       const hanCount = (raw.match(/[\u4e00-\u9fff]/g) || []).length;
       if (hanCount === 5) {
         // 五言 二/三，例："众鸟高飞尽" → ["众鸟", "高飞尽"]
         return splitByRhythm(raw, [2]);
       }
       if (hanCount === 7) {
         // 七言 二/二/三，例："无限风光尽被占" → ["无限", "风光", "尽被占"]
         return splitByRhythm(raw, [2, 4]);
       }
     }
     // 有标点或非标韵律句：按逗号切
     const body = raw.replace(/([，；、：])/g, '$1</span><span class="seg">');
     return `<span class="seg">${body}</span>`;
   }
   // 在指定字符位置（相对汉字计数）之后断开，保持 ruby 标签完整
   function splitByRhythm(raw, breakPositions) {
     let from = 0;
     const parts = [];
     for (const pos of breakPositions) {
       if (pos >= raw.length) continue;
       parts.push(raw.slice(from, pos));
       from = pos;
     }
     if (from < raw.length) parts.push(raw.slice(from));
     return parts.map(p => `<span class="seg">${p}</span>`).join('');
   }
   function plain(text) { return String(text || '').replace(/\{([^}]*)\}/g, ''); }

  // ---- icon helpers ----
  const KIND_META = {
    poem: { label: '诗词', cls: '' },
    prose: { label: '散文', cls: 'j' },
    story: { label: '故事', cls: 'j' },
    extra: { label: '课外', cls: 'v' },
    classics: { label: '名篇', cls: 'k' },
  };

  // ---- count helpers ----
  const primaryPoems = allItems.filter(x => x._kind === 'poem' && x.level === 'primary');
  const middlePoems = allItems.filter(x => x._kind === 'poem' && x.level === 'middle');

  // ============================================================
  //  RENDER: CARD
  // ============================================================
  function cardHTML(item) {
    const meta = KIND_META[item._kind] || KIND_META.poem;
    const isDone = done.has(item.id);
    const excerpt = plain(item.excerpt || item.original || item.pinyin || item.summary || item.content || '').replace(/\s+/g, ' ').trim();
    const short = excerpt.length > 46 ? excerpt.slice(0, 46) + '…' : excerpt;
    const dyn = item.dynasty ? `<span class="dyn">${esc(item.dynasty)}</span>` : '';
    const grade = item.grade ? `<span class="grade-badge">${esc(item.grade)}</span>` : '';
    const author = item.author ? `<span class="card-author">${esc(item.author)}</span>` : '';
    const tag = item.tag ? `<span class="tag2">${esc(item.tag)}</span>` : '';
    const doneMark = isDone ? `<span class="done-mark"><span class="dotg"></span>已学</span>` : '';
    return `
      <article class="card ${meta.cls} ${isDone ? 'is-done' : ''}" tabindex="0" role="button"
        data-id="${esc(item.id)}" aria-label="查看：${esc(item.title)}">
        <div class="card-top">
          <span class="card-title">${esc(item.title)}</span>
          ${dyn}${grade}
          ${author}
        </div>
        <div class="card-excerpt">${esc(short || '（点击查看）')}</div>
        <div class="card-foot">
          ${tag}
          ${doneMark}
        </div>
      </article>`;
  }

  function gridHTML(list) {
    if (!list.length) return '';
    return `<div class="grid-wrap"><div class="swipe-hint">左右滑动 →</div><div class="grid">${list.map(cardHTML).join('')}</div></div>`;
  }

  // ============================================================
  //  RENDER: DETAIL SHEET
  // ============================================================
  let currentId = null;
  let currentList = [];

  // 诗行自适应字号：七言整联在窄屏会「最后一个字掉到下一行」，很丑。
  // 策略：
  //   1) 稍微缩小（最多到 80%）能整联排成一行的，就缩；
  //   2) 还不够的，靠句内逗号把整联断成两段（7+7），字号保持不变；
  //   3) 没有标点可断的超长句，才一路缩到下限，避免整首被压成小字。
  function fitPoemLines() {
    const host = $('#sheetBody') && $('#sheetBody').querySelector('.poem-lines');
    if (!host) return;
    const lines = Array.from(host.querySelectorAll('.ln'));
    if (!lines.length) return;
    const set = v => host.style.setProperty('--fit', String(v));
    set(1);
    const avail = host.clientWidth;
    if (!avail) return;

    const MIN = 0.62;     // 字号最多缩到 62%
    const PREFER = 0.80;  // 低于这个比例就改为逗号处换行，别把字压太小
    const limit = avail * 0.98;

    // 行宽用 scrollWidth（= 实际排版宽度；Range 会把注音 rt 也算进去，偏大）
    const lineWidth = el => {
      const prev = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const w = el.scrollWidth;
      el.style.whiteSpace = prev;
      return w;
    };
    // 小段是 inline，量宽度时临时转成 inline-block
    const segWidth = el => {
      const pd = el.style.display, pw = el.style.whiteSpace;
      el.style.display = 'inline-block';
      el.style.whiteSpace = 'nowrap';
      const w = el.getBoundingClientRect().width;
      el.style.display = pd;
      el.style.whiteSpace = pw;
      return w;
    };

    let v = 1;
    const oneLine = [];        // 期望排成一行的行，用于兜底校验
    let overflow = false;      // 小段缩到下限仍放不下，兜底放开 nowrap
    for (const el of lines) {
      const segs = Array.from(el.querySelectorAll('.seg'));
      const whole = lineWidth(el);
      if (whole <= avail) { oneLine.push(el); continue; }
      const need = limit / whole;
       if (need >= PREFER) {                       // 缩一点就能排成一行

    btn.classList.toggle('on', speechActive);
    btn.textContent = !speechActive ? '朗读' : (speechPaused ? '继续' : '暂停');
    btn.setAttribute('aria-label', !speechActive ? '朗读正文' : (speechPaused ? '继续朗读' : '暂停朗读'));
  }

  function stopSpeech() {
    speechToken++;
    speechActive = false;
    speechPaused = false;
    speechQueue = [];
    speechIndex = 0;
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    if (synth) synth.cancel();
    stopAudio();
    updateSpeakBtn();
  }

  function speakNext(token) {
    if (token !== speechToken || !speechActive || speechPaused) return;
    if (speechIndex >= speechQueue.length) { stopSpeech(); return; }
    const chunk = speechQueue[speechIndex++];
    const u = new SpeechSynthesisUtterance(chunk.text);
    const v = pickZhVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'zh-CN';
    // 抑扬顿挫：句读不同，语速与音高跟着变；重点句再放慢半拍
    // 非男声时进一步降 pitch，使近似低沉稳重的听感
    let rate = 0.9, pitch = speechMale ? 0.95 : 0.72;
    if (chunk.mood === 'ask') { rate = 0.86; pitch += 0.11; }
    else if (chunk.mood === 'excl') { rate = 0.88; pitch += 0.07; }
    else if (chunk.mood === 'mid') { rate = 0.92; pitch -= 0.03; }
    else if (chunk.mood === 'decl') { rate = 0.9; pitch -= 0.01; }
    if (chunk.header) { rate = 0.84; pitch += 0.02; }
    if (chunk.emphasis) { rate = Math.min(rate, 0.8); pitch += 0.03; }
    u.rate = Math.max(0.6, Math.min(1.1, rate));
    u.pitch = Math.max(0.5, Math.min(1.4, pitch));
    u.volume = 1;
    u.onend = () => {
      if (token !== speechToken) return;
      speechTimer = setTimeout(() => { speechTimer = null; speakNext(token); }, chunk.pause);
    };
    u.onerror = () => { if (token === speechToken) stopSpeech(); };
    synth.speak(u);
  }

  function toggleSpeech() {
    if (speechActive) {
      if (speechPaused) {
        speechPaused = false;
        if (audioMode && audioEl) {
          const p = audioEl.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } else if (synth) {
          synth.resume();
          if (!speechTimer && !synth.speaking) {
            speechTimer = setTimeout(() => { speechTimer = null; speakNext(speechToken); }, 80);
          }
        }
      } else {
        speechPaused = true;
        if (audioMode && audioEl) {
          try { audioEl.pause(); } catch (e) {}
        } else {
          if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
          if (synth) synth.pause();
        }
      }
      updateSpeakBtn();
      return;
    }
    const item = byId[currentId];
    if (!item) return;
    const entry = audioEntry(item.id);
    if (entry && audioEl) { playItemAudio(item, entry); return; }
    startSpeech(item);
  }

  // 系统语音兜底：该篇没有音频、或音频播放失败时使用
  function startSpeech(item) {
    audioMode = false;
    audioHl = [];
    clearHighlight();
    if (!synth) {
      speakTip('当前浏览器不支持语音朗读，该篇暂无音频');
      return;
    }
    // 朗读顺序：标题 → 朝代 → 作者 → 正文
    const queue = [];
    const title = speechClean(item.title);
    if (title) queue.push({ text: title, pause: 520, header: true, mood: 'title' });
    const who = [speechDynasty(item.dynasty), speechClean(item.author)].filter(Boolean).join('，');
    if (who) queue.push({ text: who, pause: 780, header: true, mood: 'title' });
    queue.push(...splitSpeech(plain(bodyTextAudio(item))));
    if (!queue.length) return;
    // 重点句读出感情：放慢半拍，并在前一句后多留气口
    const norm = s => String(s || '').replace(/[^\u4e00-\u9fa5]/g, '');
    const keys = (KEY_LINES[item.id] || []).map(norm).filter(Boolean);
    if (keys.length) {
      queue.forEach((c, i) => {
        if (c.header) return;
        const t = norm(c.text);
        if (t && keys.some(k => k.includes(t) || t.includes(k))) {
          c.emphasis = true;
          c.pause = Math.max(c.pause, 420);
          if (i > 0) queue[i - 1].pause = Math.max(queue[i - 1].pause, 620);
        }
      });
    }
    speechToken++;
    const token = speechToken;
    speechQueue = queue;
    speechIndex = 0;
    speechActive = true;
    speechPaused = false;
    synth.cancel();
    updateSpeakBtn();
    // cancel 后立刻 speak 在部分浏览器会被吞掉，延时起播更稳
    speechTimer = setTimeout(() => { speechTimer = null; speakNext(token); }, 60);
  }

    const meta = KIND_META[item._kind] || KIND_META.poem;
    const kicker = [meta.label];
    if (item.grade) kicker.push(item.grade);

    $('#sheetKicker').textContent = kicker.join(' · ');
    $('#sheetTitle').textContent = item.title || '';
    $('#sheetBy').textContent = item.author ? `${item.dynasty ? item.dynasty + ' · ' : ''}${item.author}` : (item.dynasty || '');
    $('#sheetBody').innerHTML = detailHTML(item);

    const isDone = done.has(id);

  function matchesFilter(item) {

  function matchQuery(item) {
    if (!query) return true;
    const hay = [
      item.title, item.author, item.dynasty, item.grade, item.tag,
      plain(item.original), plain(item.pinyin), plain(item.translation),
      plain(item.analysis), plain(item.excerpt), plain(item.summary),
      plain(item.content), plain(item.meaning), (item.tags || []).join(' ')

  // 标题命中优先，其次作者，其余按原顺序
  function searchRank(item) {
    const t = String(item.title || '').toLowerCase();

    // 绑定返回按钮和卡片点击（避免 inline onclick 访问不到 IIFE 内部函数）
    const backBtn = host.querySelector('#grpBackBtn');
    if (backBtn) backBtn.addEventListener('click', goBackFromGroup);
    host.querySelectorAll('.member-block .card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id));
    });
  }

function renderProgress() {
    const host = $('#panel-progress');
    const total = allItems.length;
    const doneCount = allItems.filter(x => done.has(x.id)).length;
    const pct = total ? Math.round(doneCount / total * 100) : 0;

    const byKind = {};
    allItems.forEach(x => {
      byKind[x._kind] = byKind[x._kind] || { total: 0, done: 0 };
      byKind[x._kind].total++;
      if (done.has(x.id)) byKind[x._kind].done++;
    });

    const ring = (p, size) => {
      const r = (size - 10) / 2;
      const c = 2 * Math.PI * r;
      return `<svg width="${size}" height="${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(60,45,20,0.08)" stroke-width="8"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--jade)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p/100)}"/>
      </svg>`;
    };

    const rows = [
      ['poem', '诗词'], ['prose', '散文'], ['story', '故事'], ['extra', '扩展'], ['classics', '名篇']
    ].map(([k, label]) => {
      const o = byKind[k] || { total: 0, done: 0 };
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0;border-bottom:1px dashed var(--line);">
        <span>${label}</span>
        <span style="font-family:var(--sans);font-size:0.82rem;"><b style="color:var(--jade)">${o.done}</b> / ${o.total}</span>
      </div>`;
    }).join('');

    host.innerHTML = `
      <div class="sec-head j"><div class="glyph">进</div><div><h2>学习进度</h2><p>记录足迹 · 温故知新</p></div></div>
      <div class="prog-wrap">
        <div class="prog-card">
          <h3>总进度</h3>
          <div class="sub">已学会 ${doneCount} / ${total} 篇</div>
          <div class="ring-wrap">
            <div class="ring">${ring(pct, 92)}<div class="val">${pct}<small>%</small></div></div>
            <div class="ring-legend">
              已完成 <b>${doneCount}</b> 篇<br>
              待学习 <b>${total - doneCount}</b> 篇
            </div>
          </div>
          <div class="prog-actions">
            <button class="btn" id="resetProgress">清空进度</button>
          </div>
        </div>
        <div class="prog-card">
          <h3>分类统计</h3>
          <div class="sub">各板块完成情况</div>
          <div style="font-family:var(--sans);font-size:0.86rem;color:var(--ink-2);">${rows}</div>
        </div>
      </div>`;

    const rb = $('#resetProgress');
    if (rb) rb.onclick = () => {
      if (confirm('确定清空所有学习进度吗？')) {
        done.clear(); saveDone(); refreshCounts(); renderProgress();
        renderAll();
      }
    };
  }

  // ============================================================
  //  REFRESH / ROUTING
  // ============================================================
  function refreshCounts() {
    const doneCount = allItems.filter(x => done.has(x.id)).length;
    $('#navProgress').innerHTML = `已学 <b>${doneCount}</b>`;
    $('#navHomeN').textContent = (D.poems || []).length;
    $('#navPriN').textContent = primaryPoems.length;
    $('#navMidN').textContent = middlePoems.length;
    $('#navProN').textContent = (D.prose || []).length;
    $('#navStoN').textContent = (D.stories || []).length;
    $('#navExtN').textContent = (D.extras || []).length;
    $('#navClsN').textContent = (D.classics || []).length;
    $('#statPoems').textContent = (D.poems || []).length;
    $('#statProse').textContent = (D.prose || []).length;
    $('#statStory').textContent = (D.stories || []).length;
    $('#statExt').textContent = (D.extras || []).length;
    $('#statCls').textContent = (D.classics || []).length;
    $('#statGrp').textContent = GROUPS_DATA.length;
  }

  function renderAll() {
    renderHome();
    renderListPanel('primary', primaryPoems, { glyph: '小', cls: '', title: '小学篇目', sub: '一至六年级 · 部编版必背' });
    renderListPanel('middle', middlePoems, { glyph: '初', cls: 'v', title: '初中篇目', sub: '七至九年级 · 中考必考' });
    renderProse();
    renderStory();
    renderExtra();
    renderClassics();
    renderGroups();
    renderSearch();
    renderProgress();
    updateEmpty();
  }

  function updateEmpty() {
    const activeBtn = $('.nav-btn.active');
    const active = activeBtn ? activeBtn.dataset.panel : '';
    let count = 0;
    if (query) count = allItems.filter(matchQuery).length;
    else if (active === 'home') count = primaryPoems.filter(matchesFilter).length + middlePoems.filter(matchesFilter).length;
    else if (active === 'primary') count = primaryPoems.filter(matchesFilter).length;
    else if (active === 'middle') count = middlePoems.filter(matchesFilter).length;
    else if (active === 'prose') count = (D.prose || []).filter(matchesFilter).length;
    else if (active === 'story') count = (D.stories || []).filter(matchesFilter).length;
    else if (active === 'extra') count = (D.extras || []).filter(matchesFilter).length;
    else if (active === 'classics') count = (D.classics || []).filter(matchesFilter).length;
    else count = 1; // progress always visible
    $('#emptyState').classList.toggle('on', count === 0);
  }

  let currentPanel = 'home';

  function activatePanel(name) {
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === name));
    $$('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + name));
    // toolbar only for content panels
    $('#toolbar').style.display = name === 'progress' ? 'none' : '';
    updateEmpty();
  }

  function switchPanel(name) {
    currentPanel = name;
    activatePanel(name);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  //  EVENTS
  // ============================================================
  function bind() {
    // 旋转屏幕 / 改变窗口宽度时重新计算诗行字号
    let fitTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => {
        if ($('#overlay').classList.contains('on')) fitPoemLines();
      }, 150);
    });

    // nav：切换分区时清空搜索，回到完整列表
    $$('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (query) { query = ''; $('#searchInput').value = ''; renderAll(); }
        switchPanel(btn.dataset.panel);
      });
    });

    // search：全站检索，命中后进入搜索结果面板
    let t = null;
    $('#searchInput').addEventListener('input', e => {
      clearTimeout(t);
      t = setTimeout(() => {
        query = e.target.value.trim().toLowerCase();
        renderAll();
        if (query) activatePanel('search');
        else switchPanel(currentPanel);
      }, 140);
    });

    // card click (delegated)
    document.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (card) { openDetail(card.dataset.id); return; }
    });
    // keyboard on cards
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const card = e.target.closest('.card');
        if (card) { e.preventDefault(); openDetail(card.dataset.id); }
      }
      if (e.key === 'Escape' && $('#overlay').classList.contains('on')) closeDetail();
      if ($('#overlay').classList.contains('on')) {
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
      }
    });

    // sheet controls
    $('#speakBtn').addEventListener('click', toggleSpeech);
    if (audioEl) {
      audioEl.addEventListener('timeupdate', onAudioTime);
      audioEl.addEventListener('ended', () => { if (audioMode) stopSpeech(); });
      audioEl.addEventListener('error', () => {
        if (!audioMode) return;
        const item = byId[currentId];
        stopAudio();
        speechActive = false;
        updateSpeakBtn();
        speakTip('音频加载失败，已切换为系统语音');
        if (item) startSpeech(item);
      });
    }
    $('#sheetClose').addEventListener('click', closeDetail);
    $('#overlay').addEventListener('click', e => { if (e.target === $('#overlay')) closeDetail(); });
    $('#prevBtn').addEventListener('click', () => navigate(-1));
    $('#nextBtn').addEventListener('click', () => navigate(1));
    $('#doneBtn').addEventListener('click', () => { if (currentId) toggleDone(currentId); });

    // back to top
    const top = $('#toTop');
    window.addEventListener('scroll', () => top.classList.toggle('on', window.scrollY > 500), { passive: true });
    top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  // ============================================================
  //  INIT
  // ============================================================
  function init() {
    if (!allItems.length) {
      $('#homeBody').innerHTML = `<div class="empty on"><div class="big">⚠</div><div>数据加载失败：请确认 data.js 已正确引入</div></div>`;
      return;
    }
    refreshCounts();
    renderAll();
    loadAudioIndex();
    bind();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
